# Product catalog for demonstrating FIQL query patterns

type Products @table(database: "demo-fiql") @distribute @export @access(public: [read]) @compositeIndex(fields: "category,price") {
    id: ID! @primaryKey
    name: String! @indexed(type: "fulltext")
    price: Float! @indexed
    height: Float
    width: Float
    description: String @indexed(type: "fulltext")
    category: String! @indexed
    inStock: Boolean! @indexed
    manufacturer: Manufacturer
    tags: [String]
    brandId: ID @indexed
    brand: Brand @relationship(from: "brandId")
}

# Embedded (non-table) object type, stored inline on Products.manufacturer
type Manufacturer {
    name: String
    country: String
    year: Int
}

# Brands for demonstrating chained attributes and joins
type Brand @table(database: "demo-fiql") @distribute @export @access(public: [read]) {
    id: ID! @primaryKey
    name: String! @indexed
    country: String!
    foundedYear: Int
    products: [Products] @relationship(to: "brandId")
}
